[package]
name = "momento-api"
version = "0.1.0"
edition = "2021"
description = "Self-hosted photo management backend"

[lib]
path = "lib.rs"

[[bin]]
name = "momento-api"
path = "main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"

# Image processing
image = "0.25"
kamadak-exif = "0.5"

# Utils
num_cpus = "1.16"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
indexmap = "2"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
thiserror = "1"
tracing = "0.1"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "multipart", "rustls-tls", "stream"] }
glob = "0.3"
filetime = "0.2"
lazy_static = "1.4"
serde_urlencoded = "0.7"
futures = "0.3"
mime_guess = "2"
momento-common = { path = "../common" }

# Geospatial
geohash = "0.13"

# WebDAV server
dav-server = "0.7"
http-body-util = "0.1"

[dev-dependencies]
axum-test = "15"
tempfile = "3"
wiremock = "0.6"

[[test]]
name = "integration"
path = "../../tests/backend/main.rs"
