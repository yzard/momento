[package]
name = "momento-api"
version = "1.0.0"
edition = "2021"
description = "Self-hosted photo management backend"
build = "../common/build_version.rs"

[lib]
path = "lib.rs"

[[bin]]
name = "momento-api"
path = "main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"

# Image processing
image = "0.25"

# Utils
num_cpus = "1.16"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
indexmap = "2"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
thiserror = "1"
tracing = "0.1"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
glob = "0.3"
filetime = "0.2"
serde_urlencoded = "0.7"
futures = "0.3"
mime_guess = "2"
percent-encoding = "2"
csv = "1"
flate2 = "1"
rstar = "0.12"
momento-common = { path = "../common" }

# Geospatial
geohash = "0.13"

# WebDAV server
dav-server = "0.7"
http-body-util = "0.1"

[dev-dependencies]
axum-test = "15"
tempfile = "3"

[[test]]
name = "integration"
path = "../../tests/backend/main.rs"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
