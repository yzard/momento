# Momento API configuration generated on first container startup.
# Replace the example secrets and administrator password before exposing the service.

[server]
# Listen on every container interface and serve the bundled frontend on port 8000.
host = "0.0.0.0"
port = 8000
debug = false
# All database, media, preview, import, and log paths derive from this directory.
data_dir = "/data"
static_dir = "/app/static"

[security]
# Use a long random value, for example: openssl rand -hex 32
secret_key = "playground-only-change-this-secret-before-exposing-the-server"
access_token_expire_minutes = 30
refresh_token_expire_days = 7

[admin]
# The initial administrator is created from these credentials when the database is empty.
username = "admin"
password = "admin"

[webdav]
# WebDAV is always available; uploads are staged below data_dir/webdav and imported automatically.
mount_path = "/webdav"
realm = "Momento WebDAV"
max_upload_bytes = 10737418240
max_concurrent_requests = 16
poll_interval_seconds = 5
stable_file_age_seconds = 10
max_concurrent_processing = 2

[metadata]
# Thumbnail dimensions are maximum bounding-box sizes in pixels; qualities use 1-100.
thumbnails_max_size = 1200
thumbnails_tiny_size = 300
thumbnails_quality = 85
thumbnails_video_frame_quality = 85
# Reverse geocoding resolves GPS coordinates through the configured HTTP service.
reverse_geocoding_enabled = true
reverse_geocoding_base_url = "https://nominatim.openstreetmap.org/reverse"
reverse_geocoding_user_agent = "Momento/1.0 (self-hosted)"
reverse_geocoding_timeout_seconds = 10
reverse_geocoding_rate_limit_seconds = 1.0

[metadata_worker]
# Metadata jobs are leased durably so interrupted workers can recover them.
poll_interval_seconds = 10
concurrency = 16
lease_seconds = 300
max_attempts = 5

[llm_submission_worker]
# This is the global rolling window for streaming prepared jobs to llm-service.
poll_interval_seconds = 5
max_in_flight = 128

[llm]
# The API initiates one authenticated WebSocket to llm-service.
enabled = true
service_url = "ws://llm-service:8100/api/v1/llm/connect"
client_id = "playground"
# This must exactly match server.api_key in config_llm.toml.
api_key = "change-me-llm-service-key"
image_tagging_enabled = true
deduplicate_enabled = true
face_detection_enabled = true
# Lower values group less-similar faces; higher values require closer matches.
face_group_similarity_threshold = 0.55

[cronjob]
# Five-field cron expressions are evaluated in this IANA timezone.
timezone = "Etc/UTC"
# OCR and image tagging enqueue their own inference jobs.
ocr_cron = "0 1 * * *"
image_tagging_cron = "0 2 * * *"
# Deduplication uses image_clustering inference, then generates duplicate groups.
deduplicate_cron = "0 3 * * *"
# Face detection inference is followed by automatic face grouping.
face_detection_cron = "0 4 * * *"
