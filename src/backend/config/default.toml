# Momento API configuration generated on first container startup.
# Replace the example secrets and change the initial admin/admin password before exposing the service.

[server]
# Listen on every container interface and serve the bundled frontend on port 8000.
host = "{{SERVER_HOST}}"
port = {{SERVER_PORT}}
debug = {{SERVER_DEBUG}}
# Set true for one startup to temporarily accept admin/admin without replacing the stored password.
reset_admin_password = "${RESET_ADMIN_PASSWORD}"
# All database, media, preview, import, and log paths derive from this directory.
data_dir = "{{SERVER_DATA_DIR}}"
static_dir = "{{SERVER_STATIC_DIR}}"
# Buffered API extractors such as JSON are bounded independently from streaming media uploads.
api_request_body_max_bytes = {{SERVER_API_REQUEST_BODY_MAX_BYTES}}

[thread_pool]
# Startup-only execution-domain sizes. Changing them requires a restart.
cpu_workers = {{THREAD_POOL_CPU_WORKERS}}
io_workers = {{THREAD_POOL_IO_WORKERS}}
sqlite_workers = {{THREAD_POOL_SQLITE_WORKERS}}

[security]
# Use a long random value, for example: openssl rand -hex 32
secret_key = "${SECRET_KEY}"
access_token_expire_minutes = {{ACCESS_TOKEN_EXPIRE_MINUTES}}
refresh_token_expire_days = {{REFRESH_TOKEN_EXPIRE_DAYS}}
# Resource-scoped browser tickets remain valid long enough for multi-hour video playback.
media_access_ticket_expire_hours = {{MEDIA_ACCESS_TICKET_EXPIRE_HOURS}}
# Password-protected public shares use a path-scoped browser session instead of URL passwords.
share_session_expire_hours = {{SHARE_SESSION_EXPIRE_HOURS}}
# Password attempts are bounded independently by normalized identity and source address.
password_attempt_window_seconds = {{PASSWORD_ATTEMPT_WINDOW_SECONDS}}
password_attempts_per_identity = {{PASSWORD_ATTEMPTS_PER_IDENTITY}}
password_attempts_per_source = {{PASSWORD_ATTEMPTS_PER_SOURCE}}
password_lockout_seconds = {{PASSWORD_LOCKOUT_SECONDS}}
# Forwarded client addresses are used only when the direct peer is in this explicit list.
trusted_proxy_ip_addresses = []
refresh_token_cleanup_interval_seconds = {{REFRESH_TOKEN_CLEANUP_INTERVAL_SECONDS}}

[media_process]
# Media commands may run as long as required and use one internal thread; worker concurrency controls parallelism.
maximum_stderr_bytes = {{MEDIA_PROCESS_MAXIMUM_STDERR_BYTES}}
maximum_metadata_output_bytes = {{MEDIA_PROCESS_MAXIMUM_METADATA_OUTPUT_BYTES}}
maximum_normalized_image_output_bytes = {{MEDIA_PROCESS_MAXIMUM_NORMALIZED_IMAGE_OUTPUT_BYTES}}
maximum_decoded_image_pixels = {{MEDIA_PROCESS_MAXIMUM_DECODED_IMAGE_PIXELS}}

[webdav]
# WebDAV is always available; uploads are staged below data_dir/webdav and imported automatically.
mount_path = "{{WEBDAV_MOUNT_PATH}}"
realm = "{{WEBDAV_REALM}}"
max_upload_bytes = {{WEBDAV_MAX_UPLOAD_BYTES}}
stable_file_age_seconds = {{WEBDAV_STABLE_FILE_AGE_SECONDS}}

[backup]
# Android uploads are resumable and staged below data_dir/backups before import.
max_upload_bytes = {{BACKUP_MAX_UPLOAD_BYTES}}
max_chunk_bytes = {{BACKUP_MAX_CHUNK_BYTES}}
session_expiry_hours = {{BACKUP_SESSION_EXPIRY_HOURS}}

[metadata]
# Thumbnail dimensions are maximum bounding-box sizes in pixels; qualities use 1-100.
thumbnails_max_size = {{THUMBNAILS_MAX_SIZE}}
thumbnails_tiny_size = {{THUMBNAILS_TINY_SIZE}}
thumbnails_quality = {{THUMBNAILS_QUALITY}}
# GPS coordinates are reverse geocoded locally with the GeoNames data embedded in Momento.

[llm]
# The API initiates one authenticated WebSocket to llm-service.
enabled = {{LLM_ENABLED}}
# Docker Compose supplies this private service address.
server_address = "{{LLM_SERVER_ADDRESS}}"
client_id = "{{LLM_CLIENT_ID}}"
# This must exactly match server.api_key in config_llm.toml.
api_key = "${LLM_SERVICE_API_KEY}"
# All AI features are active when llm.enabled is true. Five-field cron expressions use the system timezone.
ocr_cron = "{{OCR_CRON}}"
image_tagging_cron = "{{IMAGE_TAGGING_CRON}}"
deduplicate_cron = "{{DEDUPLICATE_CRON}}"
face_detection_cron = "{{FACE_DETECTION_CRON}}"
image_aesthetics_cron = "{{IMAGE_AESTHETICS_CRON}}"
screenshot_detection_cron = "{{SCREENSHOT_DETECTION_CRON}}"
document_detection_cron = "{{DOCUMENT_DETECTION_CRON}}"

[face_group]
# Lower values group less-similar faces; higher values require closer matches.
similarity_threshold = {{FACE_GROUP_SIMILARITY_THRESHOLD}}
# These six weights must be non-negative and sum to 1.
confidence_weight = {{FACE_REPRESENTATIVE_CONFIDENCE_WEIGHT}}
face_size_weight = {{FACE_REPRESENTATIVE_FACE_SIZE_WEIGHT}}
center_proximity_weight = {{FACE_REPRESENTATIVE_CENTER_PROXIMITY_WEIGHT}}
frontality_weight = {{FACE_REPRESENTATIVE_FRONTALITY_WEIGHT}}
visibility_weight = {{FACE_REPRESENTATIVE_VISIBILITY_WEIGHT}}
feature_clarity_weight = {{FACE_REPRESENTATIVE_FEATURE_CLARITY_WEIGHT}}
