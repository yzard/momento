[package]
name = "momento-common"
version = "1.0.0"
edition = "2021"
description = "Shared infrastructure for Momento services"
build = "build_version.rs"

[lib]
path = "lib.rs"

[dependencies]
chrono = "0.4"
crc32c = "0.6"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[[test]]
name = "integration"
path = "../../tests/common/main.rs"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
