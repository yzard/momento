[package]
name = "llm-service"
version = "1.0.0"
edition = "2021"
description = "Standalone on-demand image inference service for Momento"
build = "../common/build_version.rs"

[lib]
path = "lib.rs"

[[bin]]
name = "llm-service"
path = "main.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
libc = "0.2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
momento-common = { path = "../common" }

[dev-dependencies]
axum-test = "15"
tempfile = "3"
wiremock = "0.6"
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "integration"
path = "../../tests/backend_llm/main.rs"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
