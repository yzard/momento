[package]
name = "llm-service"
version = "0.1.0"
edition = "2021"
description = "Standalone on-demand image inference service for Momento"

[lib]
path = "lib.rs"

[[bin]]
name = "llm-service"
path = "main.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["multipart"] }
base64 = "0.22"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
momento-common = { path = "../common" }

[dev-dependencies]
axum-test = "15"
tempfile = "3"
wiremock = "0.6"
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "integration"
path = "../../tests/backend_llm/main.rs"
