[package]
name = "llm-service"
version = "0.1.0"
edition = "2021"
description = "Standalone image OCR service for Momento"

[lib]
path = "lib.rs"

[[bin]]
name = "llm-service"
path = "main.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["multipart"] }
base64 = "0.22"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum-test = "15"
tempfile = "3"
wiremock = "0.6"

[[test]]
name = "integration"
path = "../../tests/backend_llm/main.rs"
