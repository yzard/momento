# llm-service configuration generated on first container startup.
# Runtime executables, model paths, and model versions are owned by the image.

[server]
# llm-service is reached by Momento over the private container network.
host = "{{SERVER_HOST}}"
port = {{SERVER_PORT}}
# This must exactly match llm.api_key in the Momento config.toml.
api_key = "${LLM_SERVICE_API_KEY}"
# Queue and runtime cache data live below data_dir/llm; logs live below data_dir/logs.
data_dir = "{{SERVER_DATA_DIR}}"

[scheduler]
# The scheduler drains one task type at a time to keep its model runtime warm.
poll_interval_seconds = {{SCHEDULER_POLL_INTERVAL_SECONDS}}
idle_shutdown_seconds = {{SCHEDULER_IDLE_SHUTDOWN_SECONDS}}
max_in_flight_jobs = {{SCHEDULER_MAX_IN_FLIGHT_JOBS}}
runtime_max_attempts = {{SCHEDULER_RUNTIME_MAX_ATTEMPTS}}
# Durable results are retried until Momento acknowledges persistence.
result_delivery_acknowledgement_timeout_seconds = {{RESULT_DELIVERY_ACKNOWLEDGEMENT_TIMEOUT_SECONDS}}
result_delivery_retry_delay_seconds = {{RESULT_DELIVERY_RETRY_DELAY_SECONDS}}
result_delivery_max_attempts = {{RESULT_DELIVERY_MAX_ATTEMPTS}}
result_delivery_max_concurrent_deliveries = {{RESULT_DELIVERY_MAX_CONCURRENT_DELIVERIES}}

[[service]]
# Unlimited-OCR through the image-owned vLLM runtime.
enabled = {{SERVICE_ENABLED}}
model_type = "ocr"
startup_timeout_seconds = {{OCR_STARTUP_TIMEOUT_SECONDS}}
request_timeout_seconds = {{OCR_REQUEST_TIMEOUT_SECONDS}}
max_tokens = {{OCR_MAX_TOKENS}}
max_concurrent_jobs = {{OCR_MAX_CONCURRENT_JOBS}}

[[service]]
# RAM++ image tagging.
enabled = {{SERVICE_ENABLED}}
model_type = "image_tagging"
startup_timeout_seconds = {{IMAGE_TAGGING_STARTUP_TIMEOUT_SECONDS}}
request_timeout_seconds = {{IMAGE_TAGGING_REQUEST_TIMEOUT_SECONDS}}
max_concurrent_jobs = {{IMAGE_TAGGING_MAX_CONCURRENT_JOBS}}

[[service]]
# DINOv2 embeddings and perceptual hashes used by deduplication.
enabled = {{SERVICE_ENABLED}}
model_type = "image_clustering"
startup_timeout_seconds = {{IMAGE_CLUSTERING_STARTUP_TIMEOUT_SECONDS}}
request_timeout_seconds = {{IMAGE_CLUSTERING_REQUEST_TIMEOUT_SECONDS}}
max_concurrent_jobs = {{IMAGE_CLUSTERING_MAX_CONCURRENT_JOBS}}

[[service]]
# OpenAI CLIP ViT-B/32 with the LAION aesthetic linear head.
enabled = {{SERVICE_ENABLED}}
model_type = "image_aesthetics"
startup_timeout_seconds = {{IMAGE_AESTHETICS_STARTUP_TIMEOUT_SECONDS}}
request_timeout_seconds = {{IMAGE_AESTHETICS_REQUEST_TIMEOUT_SECONDS}}
max_concurrent_jobs = {{IMAGE_AESTHETICS_MAX_CONCURRENT_JOBS}}

[[service]]
# InsightFace detection and embeddings. Resolution is measured on each face box.
enabled = {{SERVICE_ENABLED}}
model_type = "face_detection"
startup_timeout_seconds = {{FACE_DETECTION_STARTUP_TIMEOUT_SECONDS}}
request_timeout_seconds = {{FACE_DETECTION_REQUEST_TIMEOUT_SECONDS}}
max_concurrent_jobs = {{FACE_DETECTION_MAX_CONCURRENT_JOBS}}
minimum_face_likelihood = {{MINIMUM_FACE_LIKELIHOOD}}
minimum_face_resolution_pixels = {{MINIMUM_FACE_RESOLUTION_PIXELS}}

[[service]]
# CPU-local mobile screenshot heuristics with OCR-assisted status-region analysis.
enabled = {{SERVICE_ENABLED}}
model_type = "screenshot_detection"
startup_timeout_seconds = {{SCREENSHOT_DETECTION_STARTUP_TIMEOUT_SECONDS}}
request_timeout_seconds = {{SCREENSHOT_DETECTION_REQUEST_TIMEOUT_SECONDS}}
max_concurrent_jobs = {{SCREENSHOT_DETECTION_MAX_CONCURRENT_JOBS}}

[[service]]
# CPU-local document heuristics using text layout, paper color, and photo penalties.
enabled = {{SERVICE_ENABLED}}
model_type = "document_detection"
startup_timeout_seconds = {{DOCUMENT_DETECTION_STARTUP_TIMEOUT_SECONDS}}
request_timeout_seconds = {{DOCUMENT_DETECTION_REQUEST_TIMEOUT_SECONDS}}
max_concurrent_jobs = {{DOCUMENT_DETECTION_MAX_CONCURRENT_JOBS}}
