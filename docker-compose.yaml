services:
  momento-api:
    container_name: momento-api
    image: zhuoyin/momento:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK: "${UMASK:-022}"
      TZ: "${TZ:-UTC}"
      RESET_ADMIN_PASSWORD: "${RESET_ADMIN_PASSWORD:-false}"
      SECRET_KEY: "${SECRET_KEY:-playground-only-change-this-secret-before-exposing-the-server}"
      LLM_SERVICE_API_KEY: "${LLM_SERVICE_API_KEY:-change-me-llm-service-key}"
      LLM_SERVICE_ADDRESS: "momento-llm-debug:8100"
    ports:
      - "8000:8000"
    volumes:
      - "${MOMENTO_DATA_DIR:-./data}:/data"
    networks:
      - momento
    depends_on:
      momento-llm-debug:
        condition: service_started

  momento-llm-debug:
    container_name: momento-llm-debug
    image: zhuoyin/momento-llm-service:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK: "${UMASK:-022}"
      TZ: "${TZ:-UTC}"
      LLM_SERVICE_API_KEY: "${LLM_SERVICE_API_KEY:-change-me-llm-service-key}"
    volumes:
      - "${MOMENTO_DATA_DIR:-./data}:/data"
    networks:
      - momento
    gpus: all
    shm_size: "8gb"

networks:
  momento:
