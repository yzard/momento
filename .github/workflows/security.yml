name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      # paste is lock-only through image's disabled AVIF encoder. lru is declared by
      # dav-server's localfs feature but used only by its macOS/Windows implementations;
      # Momento's production target is the Linux container. Keep all new warnings fatal.
      - run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2026-0253
          --file src/backend/Cargo.lock
      - run: cargo audit --deny warnings --file src/backend_llm/Cargo.lock
